<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
   <title>Sweet Dreams Cupcakes - Premium Artisan Cupcakes</title>
   <meta name="description" content="Энг мазали, табиий ва премиум синфидаги капкейклар. Уйингиздан чиқмай туриб Telegram орқали тезкор буюртма беринг.">
   <meta name="keywords" content="cupcakes, капкейк, ширинликлар, торт, буюртма бериш, sweet dreams">
   <meta property="og:title" content="Sweet Dreams Cupcakes - Премиум ширинликлар">
   <meta property="og:description" content="Уйингиздан чиқмай туриб Telegram орқали тезкор буюртма беринг.">

   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
   <style>
        :root {
            --primary: #ff1f79;
            --secondary: #6a5ca3;
            --accent: #ff6b9d;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--secondary));
            --gradient-accent: linear-gradient(135deg, var(--accent), var(--primary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Background particles */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .bg-animation span {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.15;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 3rem;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 10, 0.8);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            text-decoration: none;
        }

        .logo i {
            color: var(--primary);
            margin-right: 8px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 2rem;
            background: radial-gradient(circle at center, rgba(106, 92, 163, 0.15) 0%, transparent 70%);
        }

        .hero-content {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 4rem;
            border-radius: 30px;
            max-width: 800px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .hero h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }

        .btn-primary {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 31, 121, 0.4);
        }

        /* Sections General */
        .featured {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 3rem;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: 'Dancing Script', cursive;
        }

        /* Cupcake Grid */
        .cupcake-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .cupcake-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.4s, box-shadow 0.4s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cupcake-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 31, 121, 0.2);
        }

        .cupcake-img {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
        }

        .cupcake-info {
            padding: 1.5rem;
            text-align: center;
        }

        .cupcake-info h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .cupcake-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .btn-sm {
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
        }

        /* Интерактив Буюртма Бериш Блоки */
        .order-section {
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .order-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .order-form label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: -0.5rem;
            text-align: left;
        }

        .order-form input, .order-form select {
            padding: 1rem 1.5rem;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .order-form input:focus, .order-form select:focus {
            border-color: var(--primary);
        }

        .order-form select option {
            background-color: var(--dark);
            color: white;
        }

        /* About & Contact text style */
        .about-text, .contact-info {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Stats Section */
        .stats {
            padding: 4rem 2rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stat-box {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 2rem 3rem;
            border-radius: 20px;
            text-align: center;
            min-width: 200px;
            flex: 1;
        }

        .stat-number {
            font-size: 3rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        /* Newsletter */
        .newsletter {
            padding: 6rem 2rem;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .newsletter-form {
            display: flex;
            gap: 1rem;
            margin-top: 2rem
